spring.application.name=sistema-vila-vida
server.port=8080

# Conexao com o MySQL
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/vila_vida
spring.datasource.username=vilavida
spring.datasource.password=${VILAVIDA_DB_PASSWORD}

# Configuracao do banco
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.tomcat.use-relative-redirects=true
server.forward-headers-strategy=framework

# Facilitar a atualização das páginas durante o desenvolvimento
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
spring.thymeleaf.cache=false