<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema Vila Vida</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login {
            background: white;
            padding: 35px;
            border-radius: 12px;
            width: 340px;
            max-width: 85%;
            box-shadow: 0 4px 15px #00000015;
            text-align: center;
        }
        h1 { color: #174c83; }
        label {
            display: block;
            text-align: left;
            margin-top: 18px;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #174c83;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .erro { color: #c62828; }
    </style>
</head>
<body>
    <div class="login">
        <h1>VILA VIDA</h1>
        <p>Acesso ao Sistema de Gerenciamento</p>

        <p id="erro" class="erro" hidden>
            Usuário ou senha incorretos.
        </p>

        <form th:action="@{/login}" method="post">
            <label for="username">Usuário</label>
            <input id="username" name="username" required>

            <label for="password">Senha</label>
            <input id="password" name="password"
                   type="password" required>

            <button type="submit">Entrar no Sistema</button>
        </form>
    </div>

    <script>
        if (new URLSearchParams(location.search).has("error")) {
            document.getElementById("erro").hidden = false;
        }
    </script>
</body>
</html>
